<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="OneClickHTB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13221d"/>
      <stop offset="1" stop-color="#05090a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ff1f"/>
      <stop offset="1" stop-color="#63b000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#9fef00" stroke-opacity="0.30" stroke-width="6"/>

  <!-- hexagonal lab box -->
  <path d="M256 104 L384 178 L384 334 L256 408 L128 334 L128 178 Z"
        fill="none" stroke="url(#neon)" stroke-width="20"
        stroke-linejoin="round" filter="url(#glow)"/>

  <!-- rising ladder rungs -->
  <g fill="#9fef00" filter="url(#glow)">
    <rect x="180" y="212" width="92" height="22" rx="11" opacity="0.55"/>
    <rect x="180" y="258" width="134" height="22" rx="11" opacity="0.80"/>
    <rect x="180" y="304" width="176" height="22" rx="11"/>
  </g>

  <!-- status node -->
  <circle cx="352" cy="182" r="17" fill="#26e0c8"/>
</svg>
